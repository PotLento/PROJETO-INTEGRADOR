<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Técnico - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-light">

    <h1 class="page-title">Painel do Técnico</h1>

    <div class="header-logo">
        <img src="../Logo/Fortes_logo.png" alt="Logo Fortes Engenharia" class="logo-img-header">
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <div class="card login-card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <a href="../conexao-site/conexao.html" class="text-decoration-none text-muted d-block mb-4 small">
                            <i class="fas fa-chevron-left"></i> Voltar à seleção de perfil
                        </a>

                        <form action="painel-tecnico.html">
                            
                            <div class="form-group mb-3">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
                            </div>

                            <div class="form-group mb-4">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="manter-conectado" name="manter-conectado">
                                <label class="form-check-label" for="manter-conectado">
                                    Mantenha-se conectado
                                </label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-2">Acessar</button>

                            <div class="text-center mt-4">
                                <a href="recuperar-senha.html" class="text-decoration-none">Esqueceu sua senha?</a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
